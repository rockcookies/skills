name: sync-cron
on:
  schedule:
    - cron: '17 21 * * *' # UTC 21:17 = 北京时间 05:17
  workflow_dispatch:
    inputs:
      repo:
        description: 'repoKey（留空 = 全部）'
        required: false
        default: ''
permissions:
  contents: write
  pull-requests: write
jobs:
  sync:
    # 逻辑放在 dev 的可复用 workflow 里，存根几乎不用改
    uses: rockcookies/skills/.github/workflows/sync.yml@dev
    with:
      repo: ${{ inputs.repo || '' }}
    secrets: inherit
