name: ci
on:
  pull_request:
    branches: [dev]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm audit:skills
      - run: pnpm build:release
      - run: pnpm smoke:release
