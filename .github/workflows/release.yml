name: release
on:
  push:
    branches: [dev]
concurrency:
  group: release
  cancel-in-progress: false # 排队，不取消，保证每次 dev 提交都有对应发布
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm audit:skills
      - run: pnpm build:release
      - run: pnpm smoke:release
      - run: pnpm build:site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

      # main 是 CI 生成的发布分支；CI 不能写它的 .github/（GITHUB_TOKEN 无 workflows 权限），
      # rsync 必须排除。普通 push，绝不 --force：skills lockfile 按安装时的 commit SHA 拉取。
      - uses: actions/checkout@v6
        with:
          ref: main
          path: release-main
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: publish to main
        run: |
          set -euo pipefail
          rsync -a --delete --exclude '/.git' --exclude '/.github' dist-release/ release-main/
          cd release-main
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'no release changes'
            exit 0
          fi
          git commit -m "release: ${GITHUB_SHA::7}" -m "source: dev@${GITHUB_SHA}"
          git push origin HEAD:main

  deploy:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
