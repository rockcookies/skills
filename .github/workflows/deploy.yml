name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy
  cancel-in-progress: false # 排队，不取消，保证每次发布都完成部署
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # main 是已发布的快照树（无 src/、site/），只用来读 trailer 和做一致性校验
      - uses: actions/checkout@v6
        with:
          path: published
      - id: source
        working-directory: published
        run: |
          sha="$(git log -1 --format='%(trailers:key=Source-Commit,valueonly)' | tr -d '[:space:]')"
          if [ -z "$sha" ]; then
            echo "::error::main head has no Source-Commit trailer"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # dev 上与本次发布对应的完整源码（src/、site/、packs.ts…）
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: source
      # main 上没有 .github/actions/setup 组合动作，pnpm/node 设置就地内联
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: source/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22 # skills CLI 要求 Node.js 22.20+
          cache: pnpm
          cache-dependency-path: source/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: source
      # 发布树必须等于从源码重新物化的发布面（同一 flatten/manifest 管线，字节一致）；
      # 双侧都缺席的路径（如空 commands/）跳过，单侧缺席由 diff 报错
      - name: published tree must match source-generated face
        working-directory: source
        run: |
          set -e
          pnpm release:tree --out ../verify-face
          for p in skills agents rules commands manifest.json README.md LICENSE .github/workflows/deploy.yml; do
            if [ ! -e "published/$p" ] && [ ! -e "../verify-face/$p" ]; then continue; fi
            diff -rq "published/$p" "../verify-face/$p"
          done
      - run: pnpm lint
        working-directory: source
      - run: pnpm test
        working-directory: source
      - run: pnpm check
        working-directory: source
      - run: pnpm site:build
        working-directory: source
      - run: pnpm smoke
        working-directory: source
      - run: pnpm readme:check
        working-directory: source
      - uses: actions/upload-pages-artifact@v4
        with:
          path: source/site/dist

  deploy:
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
