name: deploy
on:
  push:
    branches: [main]
concurrency:
  group: deploy
  cancel-in-progress: false # 排队，不取消，保证每次 main 提交都完成部署
permissions:
  contents: read
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm audit:skills
      - run: pnpm build:release
      - run: pnpm smoke:release
      - run: pnpm build:site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/dist

  deploy:
    needs: verify-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
