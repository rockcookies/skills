name: sync
on:
  workflow_call:
    inputs:
      repo:
        type: string
        required: false
        default: ''
    secrets:
      SYNC_PR_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      repo:
        description: 'repoKey（留空 = 全部）'
        required: false
        default: ''
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: dev # 被 main 上的存根调用时，默认 ref 是 main，必须显式指定
      - uses: ./.github/actions/setup

      - name: sync upstreams
        env:
          REPO: ${{ inputs.repo }} # 走环境变量，避免把输入直接拼进脚本
        run: pnpm cli sync --ci ${REPO:+--repo "$REPO"} --report sync-report.md

      - name: audit
        id: audit
        continue-on-error: true # 审计失败也要开 PR，把报告带上，由人决定
        run: pnpm audit:skills --report audit-report.md

      - name: compose PR body
        run: |
          {
            echo '## Upstream sync'; echo; cat sync-report.md; echo
            echo '## Audit'; echo; cat audit-report.md 2>/dev/null || echo '(no report)'
          } > pr-body.md

      - uses: peter-evans/create-pull-request@v8
        with:
          # 默认 GITHUB_TOKEN 创建的 PR 不会触发 ci.yml；需要门禁自动运行时配置 SYNC_PR_TOKEN（PAT 或 App token）
          token: ${{ secrets.SYNC_PR_TOKEN || github.token }}
          base: dev
          branch: bot/sync-upstream
          delete-branch: true
          title: 'sync: upstream skills'
          commit-message: 'sync: upstream skills'
          body-path: pr-body.md
          add-paths: |
            skills
            agents
            rules

      - name: fail run if audit failed
        if: steps.audit.outcome == 'failure'
        run: exit 1
